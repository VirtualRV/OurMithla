name: Deploy to IIS Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Production Release
        env:
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY || '6LfG9lktAAAAAN4TR70L0HLd_QG3U-2Z9ez3xJAm' }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY || '6LfG9lktAAAAAGYnPjxQEb81GB5pqP-vc87tY08b' }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT || 'ca-pub-3653662664461490' }}
        run: npm run build

      - name: Fast Deploy to IIS Folder
        shell: powershell
        run: |
          try {
              Import-Module WebAdministration -ErrorAction SilentlyContinue
          } catch {}

          # ── Configure IIS Website / AppPool Name and Target Folder Path ──
          $websiteName = "OurMithla"
          $targetFolder = "C:\inetpub\wwwroot\ourmithla"

          # Safely stop AppPool if it exists
          try {
              if (Test-Path "IIS:\AppPools\$websiteName") {
                  Stop-WebAppPool -Name $websiteName -ErrorAction SilentlyContinue
              }
          } catch {
              Write-Host "AppPool check skipped or AppPool not found. Continuing build copy..."
          }

          # Ensure target directory exists
          if (!(Test-Path -Path $targetFolder)) {
              New-Item -ItemType Directory -Force -Path $targetFolder
          }

          # Helper function for Robocopy (Robocopy returns 1-7 for successful copy status)
          function Sync-Folder {
              param([string]$Src, [string]$Dest)
              & robocopy $Src $Dest /MIR /MT:16 /NP /NFL /NDL /NJH /NJS
              if ($LASTEXITCODE -le 7) {
                  $global:LASTEXITCODE = 0
              }
          }

          # Fast multi-threaded sync
          Sync-Folder ".next" "$targetFolder\.next"
          Sync-Folder "public" "$targetFolder\public"
          Sync-Folder "data" "$targetFolder\data"
          Sync-Folder "node_modules" "$targetFolder\node_modules"

          # Single file copies
          Copy-Item -Path "server.js" -Destination "$targetFolder\server.js" -Force
          Copy-Item -Path "web.config" -Destination "$targetFolder\web.config" -Force
          Copy-Item -Path "package.json" -Destination "$targetFolder\package.json" -Force
          Copy-Item -Path "package-lock.json" -Destination "$targetFolder\package-lock.json" -Force
          if (Test-Path ".env.local") { Copy-Item -Path ".env.local" -Destination "$targetFolder\.env.local" -Force }

          # Safely start AppPool if it exists
          try {
              if (Test-Path "IIS:\AppPools\$websiteName") {
                  Start-WebAppPool -Name $websiteName -ErrorAction SilentlyContinue
              }
          } catch {
              Write-Host "AppPool start skipped."
          }

          # Ensure exit code is 0
          $global:LASTEXITCODE = 0
