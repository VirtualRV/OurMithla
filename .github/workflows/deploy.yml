name: Deploy to IIS Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Production Release
        run: npm run build

      - name: Fast Deploy to IIS Folder
        shell: powershell
        run: |
          Import-Module WebAdministration

          # ── Configure IIS Website / AppPool Name and Target Folder Path ──
          $websiteName = "OurMithla"
          $targetFolder = "C:\inetpub\wwwroot\ourmithla"

          # Stop AppPool to unlock files before sync
          Stop-WebAppPool -Name $websiteName -ErrorAction SilentlyContinue

          # Ensure target directory exists
          if (!(Test-Path -Path $targetFolder)) {
              New-Item -ItemType Directory -Force -Path $targetFolder
          }

          # Fast multi-threaded sync using native Windows robocopy (50x faster than Copy-Item for node_modules)
          robocopy ".next" "$targetFolder\.next" /MIR /MT:16 /NP /NFL /NDL /NJH /NJS
          robocopy "public" "$targetFolder\public" /MIR /MT:16 /NP /NFL /NDL /NJH /NJS
          robocopy "data" "$targetFolder\data" /MIR /MT:16 /NP /NFL /NDL /NJH /NJS
          robocopy "node_modules" "$targetFolder\node_modules" /MIR /MT:16 /NP /NFL /NDL /NJH /NJS

          # Single file copies
          Copy-Item -Path "server.js" -Destination "$targetFolder\server.js" -Force
          Copy-Item -Path "web.config" -Destination "$targetFolder\web.config" -Force
          Copy-Item -Path "package.json" -Destination "$targetFolder\package.json" -Force
          Copy-Item -Path "package-lock.json" -Destination "$targetFolder\package-lock.json" -Force

          # Reset exit code (robocopy uses 1-7 for successful copy status)
          $global:LASTEXITCODE = 0

          # Restart AppPool to serve the new build
          Start-WebAppPool -Name $websiteName -ErrorAction SilentlyContinue
